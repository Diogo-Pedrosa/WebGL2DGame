<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 2D Game</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
    <main>
        <div class="top-bar">
            <h1>WebGL 2D Game</h1>
            <button id="fullscreenButton" type="button" aria-label="Alternar tela cheia">Tela cheia</button>
        </div>
        
        <canvas id="gameCanvas" width="960" height="540">
            Seu navegador não oferece suporte ao elemento canvas.
        </canvas>
        <p id="buildStatus" aria-live="polite">Clique em um quadrado vazio para posicionar um Deputy (Custo: 2). Clique num Deputy para evoluir (Custo: 3).</p>
        
        <div id="gameOverScreen" style="display: none;">
            <h2>O banco foi roubado!</h2>
            <button id="restartButton">Recomeçar</button>
        </div>

        <div id="upgradeScreen" style="display: none;">
            <h2>Escolha um Upgrade!</h2>
            <div id="upgradeCards"></div>
            <button id="skipUpgradeButton">Pular (Grátis)</button>
        </div>
    </main>

    <script type="module" src="src/main.js?v=13"></script>
</body>

</html>
